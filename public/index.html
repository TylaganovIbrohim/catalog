<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог одежды</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --primary: #f97316;
            --primary-dark: #ea580c;
            --text: #f8fafc;
            --text-light: #a1a1aa;
            --success: #4ade80;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
        
        header {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-btn { font-size: 24px; background: none; border: none; cursor: pointer; padding: 8px; color: var(--text); }
        .header-title { font-size: 18px; font-weight: 700; color: var(--primary); text-align: center; flex-grow: 1; }
        .back-btn {
            display: none;
            background: none;
            border: none;
            font-size: 16px;
            color: var(--primary);
            cursor: pointer;
            padding: 8px;
            font-weight: 700;
            min-width: 40px;
            text-align: left;
        }
        .back-btn.active { display: block; }

        /* Боковое меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100vh;
            background: var(--card-bg);
            z-index: 100;
            transition: left 0.3s ease;
            box-shadow: 4px 0 16px rgba(0,0,0,0.5);
            overflow-y: auto;
            padding: 20px;
            border-right: 1px solid var(--border);
        }
        .sidebar.active { left: 0; }
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 90;
            display: none;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }
        .sidebar h3 { margin: 24px 0 12px; font-size: 13px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        .sidebar h3:first-child { margin-top: 40px; }
        .sidebar ul { list-style: none; }
        .sidebar li { padding: 14px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 15px; transition: all 0.2s; border-radius: 8px; }
        .sidebar li:active { background: var(--primary); color: white; }
        .close-sidebar { position: absolute; top: 16px; right: 16px; font-size: 28px; background: none; border: none; cursor: pointer; color: var(--text-light); }

        /* Главный экран */
        .main-categories {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px;
            min-height: 85vh;
            justify-content: center;
        }
        .category-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            border: 2px solid var(--primary);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
        }
        .category-card:active { transform: scale(0.97); background: var(--primary); color: white; }

        /* Экран подкатегорий */
        .subcategories-view {
            display: none;
            padding: 16px;
        }
        .subcategories-view.active { display: block; }
        .subcategories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .subcategory-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 24px 12px;
            border-radius: 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .subcategory-card:active { 
            border-color: var(--primary); 
            background: var(--primary); 
            color: white;
            transform: scale(0.96);
        }
        .subcategory-card.all {
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .subcategory-card.all:active {
            background: #fbbf24;
            color: #0f0f0f;
        }

        /* Сетка товаров */
        .product-grid {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }
        .product-grid.active { display: grid; }

        /* Карточка товара */
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: #27272a;
        }
        .product-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        
        .product-id {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            background: rgba(249, 115, 22, 0.1);
            text-align: center;
            transition: all 0.3s;
            user-select: none;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        .product-id.copied {
            background: var(--success);
            color: #0f0f0f;
            border-color: var(--success);
            animation: blink-green 0.4s ease-in-out 2;
        }
        @keyframes blink-green {
            0%, 100% { background: var(--success); color: #0f0f0f; }
            50% { background: #86efac; color: #064e3b; }
        }
        
        .product-price { font-size: 18px; font-weight: 800; color: var(--text); text-align: center; }
        .product-size { 
            font-size: 13px; 
            color: var(--text-light); 
            background: #27272a; 
            padding: 8px; 
            border-radius: 8px; 
            text-align: center;
            font-weight: 700;
        }
        .product-category {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            line-height: 1.3;
        }

        .loading, .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <button class="back-btn" id="backBtn" onclick="goBack()">← Назад</button>
    <span class="header-title" id="headerTitle">Каталог</span>
    <div style="width: 40px;"></div>
</header>

<!-- Боковое меню -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <button class="close-sidebar" onclick="toggleSidebar()">×</button>
    
    <h3>Навигация</h3>
    <ul>
        <li onclick="filterByDirectCategory('all')">🔥 Все товары</li>
    </ul>

    <h3>Мужское</h3>
    <ul id="sidebarMale"></ul>

    <h3>Женское</h3>
    <ul id="sidebarFemale"></ul>
</div>

<!-- Главный экран -->
<div class="main-categories" id="mainCategories">
    <div class="category-card" onclick="selectMainCategory('male')">
        МУЖСКОЕ
    </div>
    <div class="category-card" onclick="selectMainCategory('female')">
        ЖЕНСКОЕ
    </div>
</div>

<!-- Экран подкатегорий -->
<div class="subcategories-view" id="subcategoriesView">
    <div class="subcategories-grid" id="subcategoriesGrid"></div>
</div>

<!-- Сетка товаров -->
<div class="product-grid" id="productGrid">
    <div class="loading" id="loading">Загрузка товаров...</div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsrcT84CP6nZq8YG2KWfcu6TCtQpQoNm0",
      authDomain: "catalog-app-1014f.firebaseapp.com",
      projectId: "catalog-app-1014f",
      storageBucket: "catalog-app-1014f.firebasestorage.app",
      messagingSenderId: "1047135603204",
      appId: "1:1047135603204:web:6c7ceeaed34f73154ac351",
      measurementId: "G-0LQQQ1TBYP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Чёткий список категорий с точным соответствием id-name из Firebase
    const categories = [
        // Мужское
        { id: 'men_underwear', name: 'Трусы мужские', gender: 'male' },
        { id: 'men_tshirt', name: 'Майки мужские', gender: 'male' },
        { id: 'men_pajamas', name: 'Пижамы мужские', gender: 'male' },
        { id: 'men_shirts', name: 'Футболки мужские', gender: 'male' },
        { id: 'men_long_sleeve', name: 'Футболки с длинным рукавом', gender: 'male' },
        { id: 'men_sweatshirt', name: 'Толстовка мужская', gender: 'male' },
        { id: 'men_trousers', name: 'Штаны мужские', gender: 'male' },
        { id: 'men_shorts', name: 'Шорты мужские', gender: 'male' },
        
        // Женское
        { id: 'women_panties', name: 'Трусы женские', gender: 'female' },
        { id: 'women_tshirts', name: 'Майки женские', gender: 'female' },
        { id: 'women_tshirt', name: 'Женские футболки', gender: 'female' },
        { id: 'sarah', name: 'Сарочка', gender: 'female' },
        { id: 'women_pajamas', name: 'Пижама женские', gender: 'female' },
        { id: 'robes', name: 'Халаты', gender: 'female' },
        { id: 'tunics_and_dresses', name: 'Туника и платья', gender: 'female' },
        { id: 'women_deuce', name: 'Двойка женская', gender: 'female' },
        { id: 'women_trousers', name: 'Штаны женские', gender: 'female' },
        { id: 'women_shirt', name: 'Рубашка женская', gender: 'female' },
        { id: 'wwo_piece_suit', name: 'Костюм двойка', gender: 'female' },
        { id: 'women_sweatshirt', name: 'Толстовка женская', gender: 'female' }
    ];

    let allProducts = [];
    let currentGender = null; // 'male' | 'female' | null
    let currentCategoryId = 'all'; // 'all' | 'male_all' | 'female_all' | 'breeches' | и т.д.

    // Инициализация бокового меню
    function initSidebar() {
        const maleList = document.getElementById('sidebarMale');
        const femaleList = document.getElementById('sidebarFemale');
        
        categories.forEach(cat => {
            const li = document.createElement('li');
            li.textContent = cat.name;
            li.onclick = () => {
                filterByDirectCategory(cat.id);
                toggleSidebar();
            };
            if (cat.gender === 'male') {
                maleList.appendChild(li);
            } else {
                femaleList.appendChild(li);
            }
        });
    }

    window.toggleSidebar = function() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    };

    window.showMainCategories = function() {
        currentGender = null;
        currentCategoryId = 'all';
        document.getElementById('mainCategories').style.display = 'flex';
        document.getElementById('subcategoriesView').classList.remove('active');
        document.getElementById('productGrid').classList.remove('active');
        document.getElementById('backBtn').classList.remove('active');
        document.getElementById('headerTitle').textContent = 'Каталог';
    };

    window.selectMainCategory = function(gender) {
        currentGender = gender;
        currentCategoryId = gender === 'male' ? 'male_all' : 'female_all';
        
        document.getElementById('mainCategories').style.display = 'none';
        document.getElementById('productGrid').classList.remove('active');
        document.getElementById('subcategoriesView').classList.add('active');
        document.getElementById('backBtn').classList.add('active');
        
        const title = gender === 'male' ? 'Мужские категории' : 'Женские категории';
        document.getElementById('headerTitle').textContent = title;
        
        renderSubcategories(gender);
    };

    function renderSubcategories(gender) {
        const grid = document.getElementById('subcategoriesGrid');
        grid.innerHTML = '';
        const cats = categories.filter(c => c.gender === gender);
        
        // Кнопка "Все товары" этого пола
        const allCard = document.createElement('div');
        allCard.className = 'subcategory-card all';
        allCard.textContent = '🔥 Все товары';
        allCard.onclick = () => selectSubcategory(gender === 'male' ? 'male_all' : 'female_all');
        grid.appendChild(allCard);

        cats.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'subcategory-card';
            card.textContent = cat.name;
            card.onclick = () => selectSubcategory(cat.id);
            grid.appendChild(card);
        });
    }

    window.selectSubcategory = function(categoryId) {
        currentCategoryId = categoryId;
        document.getElementById('subcategoriesView').classList.remove('active');
        document.getElementById('productGrid').classList.add('active');
        
        let title = 'Товары';
        if (categoryId === 'male_all') title = 'Все мужские';
        else if (categoryId === 'female_all') title = 'Все женские';
        else {
            const cat = categories.find(c => c.id === categoryId);
            if (cat) title = cat.name;
        }
        document.getElementById('headerTitle').textContent = title;
        
        renderProducts();
    };

    window.goBack = function() {
        if (currentCategoryId !== 'male_all' && currentCategoryId !== 'female_all' && currentCategoryId !== 'all') {
            // Если мы в товарах конкретной категории, возвращаемся к подкатегориям
            if (currentGender) {
                selectMainCategory(currentGender);
            } else {
                showMainCategories();
            }
        } else {
            // Иначе возвращаемся на главный экран
            showMainCategories();
        }
    };

    window.filterByDirectCategory = function(categoryId) {
        currentCategoryId = categoryId;
        
        // Определяем пол для корректной работы кнопки "Назад"
        if (categoryId === 'male_all' || categories.some(c => c.id === categoryId && c.gender === 'male')) {
            currentGender = 'male';
        } else if (categoryId === 'female_all' || categories.some(c => c.id === categoryId && c.gender === 'female')) {
            currentGender = 'female';
        } else {
            currentGender = null;
        }
        
        document.getElementById('mainCategories').style.display = 'none';
        document.getElementById('subcategoriesView').classList.remove('active');
        document.getElementById('productGrid').classList.add('active');
        document.getElementById('backBtn').classList.add('active');
        
        let title = 'Все товары';
        if (categoryId === 'male_all') title = 'Все мужские';
        else if (categoryId === 'female_all') title = 'Все женские';
        else {
            const cat = categories.find(c => c.id === categoryId);
            if (cat) title = cat.name;
        }
        document.getElementById('headerTitle').textContent = title;
        
        renderProducts();
    };

    window.copyId = function(element, id) {
        navigator.clipboard.writeText(id).then(() => {
            element.classList.add('copied');
            element.textContent = 'Скопировано!';
            setTimeout(() => {
                element.classList.remove('copied');
                element.textContent = `Арт: ${id}`;
            }, 800);
        }).catch(err => {
            console.error('Не удалось скопировать: ', err);
        });
    };

    window.setProductImage = function(imgElement, productId) {
        const cleanId = String(productId).trim();
        const jpgUrl = `images/${cleanId}.jpg`;
        const jpegUrl = `images/${cleanId}.jpeg`;
        
        imgElement.src = jpgUrl;
        imgElement.onerror = function() {
            imgElement.src = jpegUrl;
            imgElement.onerror = function() {
                imgElement.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 200 200"><rect width="200" height="200" fill="%2327272a"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23a1a1aa" font-family="sans-serif" font-size="16">Нет фото</text></svg>';
            };
        };
    };

    async function loadProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products")); // Убедись, что коллекция называется "products"
            allProducts = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const productId = data.id || doc.id;
                allProducts.push({
                    ...data,
                    displayId: String(productId).trim()
                });
            });
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error("Ошибка загрузки: ", error);
            document.getElementById('loading').textContent = 'Ошибка загрузки. Проверь название коллекции в Firebase.';
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        const loadingDiv = document.getElementById('loading');
        grid.innerHTML = '';
        grid.appendChild(loadingDiv);

        let filtered = allProducts;

        // СТРОГАЯ ФИЛЬТРАЦИЯ ПО id-name
        if (currentCategoryId === 'male_all') {
            const maleIds = categories.filter(c => c.gender === 'male').map(c => c.id);
            filtered = allProducts.filter(p => maleIds.includes(String(p['id-name']).trim()));
        } else if (currentCategoryId === 'female_all') {
            const femaleIds = categories.filter(c => c.gender === 'female').map(c => c.id);
            filtered = allProducts.filter(p => femaleIds.includes(String(p['id-name']).trim()));
        } else if (currentCategoryId !== 'all') {
            // Точное совпадение с id-name (например, 'breeches' === 'breeches')
            filtered = allProducts.filter(p => String(p['id-name']).trim() === currentCategoryId);
        }

        if (filtered.length === 0) {
            grid.innerHTML += '<div class="empty-state">В этой категории пока нет товаров</div>';
            return;
        }

        filtered.forEach(product => {
            const productId = product.displayId;
            const price = product.price || '0';
            const size = product.size || 'Не указан';
            
            // Находим русское название категории для отображения в карточке
            const catObj = categories.find(c => c.id === String(product['id-name']).trim());
            const categoryName = catObj ? catObj.name : (product['id-name'] || 'Категория');

            const card = document.createElement('div');
            card.className = 'product-card';
            
            const img = document.createElement('img');
            img.className = 'product-image';
            img.alt = productId;
            setTimeout(() => window.setProductImage(img, productId), 0);

            const info = document.createElement('div');
            info.className = 'product-info';

            const idDiv = document.createElement('div');
            idDiv.className = 'product-id';
            idDiv.textContent = `Арт: ${productId}`;
            idDiv.onclick = function() { window.copyId(this, productId); };

            const catDiv = document.createElement('div');
            catDiv.className = 'product-category';
            catDiv.textContent = categoryName;

            const priceDiv = document.createElement('div');
            priceDiv.className = 'product-price';
            priceDiv.textContent = `${price} сум`;

            const sizeDiv = document.createElement('div');
            sizeDiv.className = 'product-size';
            sizeDiv.textContent = `Размер: ${size}`;

            info.appendChild(idDiv);
            info.appendChild(catDiv);
            info.appendChild(priceDiv);
            info.appendChild(sizeDiv);

            card.appendChild(img);
            card.appendChild(info);
            grid.appendChild(card);
        });
    }

    // Запуск
    initSidebar();
    loadProducts();
</script>

</body>
</html>
